<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Example Login</title></head>
  <body>
    <h1>Sign in</h1>
    <form id="login" onsubmit="return false">
      <input type="search" name="q" placeholder="Search site" />
      <label>Email <input id="user" type="email" name="email" autocomplete="username" /></label>
      <label>Password <input id="pass" type="password" name="password" autocomplete="current-password" /></label>
      <input type="hidden" name="csrf" value="x" />
      <button>Sign in</button>
    </form>
    <h2>Create account</h2>
    <form id="signup" onsubmit="return false">
      <input id="newpass" type="password" autocomplete="new-password" />
      <input id="newpass2" type="password" autocomplete="new-password" />
    </form>
    <div id="events"></div>
    <script>
      for (const id of ['user', 'pass']) document.getElementById(id).addEventListener('input', () => (document.getElementById('events').textContent += id + ';'));
    </script>
  </body>
</html>
